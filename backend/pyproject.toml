[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nutrisnap-backend"
version = "1.0.0"
description = "AI-powered nutrition tracking and analysis backend"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "NutriSnap Team"}
]
keywords = ["nutrition", "health", "ai", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi==0.110.1",
    "uvicorn==0.25.0",
    "gunicorn==21.2.0",
    "asyncpg==0.29.0",
    "python-dotenv==1.2.1",
    "pydantic==2.12.5",
    "python-multipart==0.0.21",
    "httpx==0.28.1",
    "openai==1.99.9",
    "PyJWT==2.10.1",
    "python-jose==3.5.0",
    "passlib==1.7.4",
    "bcrypt==4.1.3",
    "pillow==12.0.0",
    "pandas==2.3.3",
    "numpy==2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio",
    "black==25.12.0",
    "isort==7.0.0",
    "flake8==7.3.0",
    "mypy==1.19.1",
]

test = [
    "pytest==9.0.2",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
]

prod = [
    "gunicorn==21.2.0",
]

[project.scripts]
nutrisnap-server = "app.main:main"

[tool.setuptools]
packages = ["app", "app.core", "app.api", "app.api.routes", "app.services", "app.db", "app.schemas", "app.utils"]

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
