worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # ── Performance ────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # ── Security headers ───────────────────────────────────────
    server_tokens off;

    # ── Upstream: gunicorn inside Docker ──────────────────────
    upstream nutrisnap_api {
        server api:8000;
        keepalive 32;
    }

    # ── HTTP server (redirect to HTTPS once cert is added) ────
    server {
        listen 80;
        server_name _;          # replace _ with your domain once you have one

        # Health check endpoint — no redirect, used by load balancers
        location /health {
            proxy_pass         http://nutrisnap_api;
            proxy_set_header   Host $host;
            access_log         off;
        }

        # Redirect all other HTTP to HTTPS when SSL is configured.
        # Uncomment the block below and comment out the proxy_pass block
        # once you have an SSL cert (see deploy.sh for certbot instructions).

        # return 301 https://$host$request_uri;

        # ── Proxy to API (HTTP-only mode until cert is added) ──
        location / {
            proxy_pass         http://nutrisnap_api;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            # Match gunicorn/uvicorn timeout
            proxy_read_timeout    125s;
            proxy_connect_timeout 10s;
            proxy_send_timeout    125s;

            # Body size limit (must be >= MAX_UPLOAD_SIZE_MB in .env)
            client_max_body_size  12m;
        }
    }

    # ── HTTPS server (uncomment after certbot) ─────────────────
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_session_cache   shared:SSL:10m;
    #
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #     add_header X-Content-Type-Options nosniff;
    #     add_header X-Frame-Options DENY;
    #
    #     location / {
    #         proxy_pass         http://nutrisnap_api;
    #         proxy_http_version 1.1;
    #         proxy_set_header   Host              $host;
    #         proxy_set_header   X-Real-IP         $remote_addr;
    #         proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #         proxy_set_header   X-Forwarded-Proto https;
    #         proxy_set_header   Connection        "";
    #         proxy_read_timeout    125s;
    #         client_max_body_size  12m;
    #     }
    # }
}
