# Nginx configuration for NutriSnap Backend API
# Install to: /etc/nginx/sites-available/nutrisnap
# Then: sudo ln -s /etc/nginx/sites-available/nutrisnap /etc/nginx/sites-enabled/
# Test: sudo nginx -t
# Reload: sudo systemctl reload nginx

upstream nutrisnap_backend {
    server 127.0.0.1:8000 fail_timeout=10s max_fails=3;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# HTTP server (redirect to HTTPS in production)
server {
    listen 80;
    listen [::]:80;
    server_name api.nutrisnap.com;  # Replace with your domain
    
    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirect to HTTPS (uncomment in production after SSL setup)
    # return 301 https://$server_name$request_uri;
    
    # For initial setup without SSL, proxy directly
    location / {
        proxy_pass http://nutrisnap_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        
        # Rate limiting
        limit_req zone=api_limit burst=20 nodelay;
    }
    
    # Health check (no rate limit)
    location /health {
        proxy_pass http://nutrisnap_backend;
        access_log off;
    }
}

